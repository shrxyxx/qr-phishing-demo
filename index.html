<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Security Demonstration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            justify-content: center;

        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .badge {
            display: inline-block;
            background: #fff3cd;

            border-radius: 20px;
            font-size: 13px;

        }

        h1 {
            margin: 0 0 8px;

        .subtitle {
            color: #666;

            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;

            font-weight: bold;
        }

        input {
            width: 100%;

            border: 1px solid #ccc;

        }

        button {
            width: 100%;

            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .message {
            margin-top: 18px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .success {
            background: #e8f5e9;
            border: 1px solid #81c784;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffda6a;
        }

        .lesson {
            margin-top: 22px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 10px;

        }

        code {
            background: #eee;

            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="badge">
            CYBERSECURITY CLASSROOM DEMO
        </div>

        <h1>QR Login Simulation</h1>

        <div class="subtitle">
            This page demonstrates the danger of logging in through
            unexpected QR codes.
        </div>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                type="text"
                autocomplete="off"
                placeholder="Enter demo username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="off"
                placeholder="Enter demo password"
                required
            >

            <button type="submit">
                Continue
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="lesson">

            <strong>Training credentials</strong>

            <p>
                Username:
                <code>student-demo</code>
            </p>

            <p>
                Password:
                <code>demo-password</code>
            </p>

            <p>
                Never enter your real password into this demonstration.
            </p>

        </div>

    </div>

</div>


<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    /*
       SAFETY FEATURE:

       The page accepts ONLY the predefined training credentials.
       Nothing is sent to a server.
       Nothing is stored.
    */

    if (
        username === "student-demo" &&
        password === "demo-password"
    ) {

        message.style.display = "block";
        message.className = "message success";

        message.innerHTML = `
            <strong>⚠️ Simulation complete.</strong>

            <p>
                Imagine this were a malicious QR-code website.
                The information entered into the form could potentially
                have been sent to an attacker.
            </p>

            <p>
                In this demonstration, however, your information
                was NOT transmitted or stored.
            </p>

            <strong>
                Always check the destination website before entering
                your credentials.
            </strong>
        `;

        document.getElementById("password").value = "";

    } else {

        message.style.display = "block";
        message.className = "message warning";

        message.innerHTML = `
            <strong>Demo credentials only.</strong>

            <p>
                Use:
                <code>student-demo</code>
                /
                <code>demo-password</code>
            </p>

            <p>
                Do not enter a real password.
            </p>
        `;
    }

});

</script>

</body>
</html>
